    @keyframes gs-highlights-reposkins-neon-dark-float-c { 0%,100% { transform: translate(0,0) scale(1); opacity: .34; } 50% { transform: translate(18px,-12px) scale(1.18); opacity: .62; } }
    @keyframes gs-highlights-reposkins-neon-dark-ring { 0%,100% { opacity: .06; } 50% { opacity: .22; } }
    @keyframes gs-highlights-reposkins-neon-dark-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes gs-highlights-reposkins-neon-dark-cursor { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }
    @keyframes gs-highlights-reposkins-neon-dark-bar { from { transform: scaleX(0); } to { transform: scaleX(1); } }
